name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache release FFmpeg archive
        uses: actions/cache@v5
        with:
          path: out/dependencies/ffmpeg/
          key: ffmpeg-win-x64-${{ hashFiles('tools/package-ffmpeg.ps1') }}
      - name: Build
        run: ./build.ps1 build
      - name: Unit and reference tests
        run: ./build.ps1 test -- --no-build --no-restore
      - name: Headless encoder menu regression
        run: ./build.ps1 appcheck-headless
      - name: Synthetic x86 memory checks
        run: ./build.ps1 gamecheck -- memory32
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Publish self-contained application
        run: ./build.ps1 publish
      - name: Export and frame cadence tests
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          $env:MRM_FFMPEG = "$PWD/artifacts/win-x64/ffmpeg.exe"
          ./build.ps1 e2e -- --no-build --no-restore
      - name: Publish complete Native AOT package
        run: ./build.ps1 publish-aot
      - name: Run published native validation tools
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          $env:MRM_FFMPEG = "$PWD/artifacts/win-x64-aot/ffmpeg.exe"
          ./build.ps1 aotcheck
      - name: Native desktop UI Automation smoke
        run: ./build.ps1 appcheck-aot
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-validation-diagnostics
          path: |
            out/aot-check/logs/
            out/appcheck/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: ManiaReplayViewer-win-x64-aot
          path: |
            artifacts/ManiaReplayViewer-win-x64-aot.zip
            artifacts/ManiaReplayViewer-win-x64-aot.measurements.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: ManiaReplayViewer-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
      - name: Publish single executable
        run: ./build.ps1 publish-single
      - uses: actions/upload-artifact@v6
        with:
          name: ManiaReplayViewer-win-x64-single
          path: artifacts/ManiaReplayViewer-win-x64-single.zip
          if-no-files-found: error
