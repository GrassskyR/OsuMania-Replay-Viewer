name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v3.1.0 or v3.1.0-rc.1; new tags use the selected branch commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  revision:
    name: Resolve version and source commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
      prerelease: ${{ steps.revision.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release revision
        id: revision
        shell: pwsh
        run: ./tools/ci/resolve-release.ps1

  validate:
    name: Validate release package
    needs: revision
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.revision.outputs.sha }}
      version: ${{ needs.revision.outputs.version }}

  publish:
    name: Publish validated package
    needs: [revision, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_REVISION: ${{ needs.revision.outputs.sha }}
      EXPECTED_VERSION: ${{ needs.revision.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.revision.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ManiaReplayViewer-win-x64-aot
          path: artifacts/
      - name: Verify source, version and archive before publication
        shell: pwsh
        run: |
          ./tools/ci/resolve-release.ps1 -ExpectedRevision $env:EXPECTED_REVISION
          $report = Get-Content artifacts/ManiaReplayViewer-win-x64-aot.measurements.json -Raw | ConvertFrom-Json
          if ($report.aot.build.source_revision -ne $env:EXPECTED_REVISION -or $report.aot.build.version -ne $env:EXPECTED_VERSION -or $report.aot.build.source_dirty) {
            throw 'Downloaded package does not match the validated release revision/version.'
          }
          $hash = (Get-FileHash artifacts/ManiaReplayViewer-win-x64-aot.zip -Algorithm SHA256).Hash
          if ($hash -ne $report.aot.zip_sha256) { throw 'Downloaded ZIP checksum mismatch.' }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.revision.outputs.sha }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ needs.revision.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/ManiaReplayViewer-win-x64-aot.zip
            artifacts/ManiaReplayViewer-win-x64-aot.measurements.json
