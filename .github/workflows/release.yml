name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release; new tags use the selected branch commit (for example, v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release revision
        id: revision
        run: |
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git check-ref-format $tagRef
          if ($LASTEXITCODE -ne 0) { throw "Invalid release tag: $env:RELEASE_TAG" }

          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -eq 0) {
            git checkout --detach $tagRef
            if ($LASTEXITCODE -ne 0) { throw "Could not check out release tag: $env:RELEASE_TAG" }
          } elseif ($LASTEXITCODE -eq 1 -and $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            Write-Host "New tag $env:RELEASE_TAG will be created after a successful build."
          } else {
            throw "Could not resolve release tag: $env:RELEASE_TAG"
          }

          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the release commit.' }
          "sha=$commit" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Cache release FFmpeg archive
        uses: actions/cache@v5
        with:
          path: out/dependencies/ffmpeg/
          key: ffmpeg-win-x64-${{ hashFiles('tools/package-ffmpeg.ps1') }}
      - name: Build
        run: ./build.ps1 build
      - name: Unit and reference tests
        run: ./build.ps1 test -- --no-build --no-restore
      - name: Synthetic x86 memory checks
        run: ./build.ps1 gamecheck -- memory32
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Publish self-contained application
        run: ./build.ps1 publish
      - name: Export and frame cadence tests
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          $env:MRM_FFMPEG = "$PWD/artifacts/win-x64/ffmpeg.exe"
          ./build.ps1 e2e -- --no-build --no-restore
      - name: Package self-contained application
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/ManiaReplayViewer-win-x64.zip -Force
      - name: Publish single executable
        run: ./build.ps1 publish-single
      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ManiaReplayViewer-windows-release
          path: |
            artifacts/ManiaReplayViewer-win-x64.zip
            artifacts/ManiaReplayViewer-win-x64-single.zip
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.revision.outputs.sha }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/ManiaReplayViewer-win-x64.zip
            artifacts/ManiaReplayViewer-win-x64-single.zip
